<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff dashboard - StuDesk</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
  <link rel="stylesheet" href="/static/css/common.css">
  <link rel="stylesheet" href="/static/css/pages/staff-dashboard.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <header>
    <nav class="navbar">
      <a class="brand" href="/">StuDesk</a>
      <ul>
        <li><a class="active" href="/staff-dashboard.html">Dashboard</a></li>
        <li><a href="/login.html" onclick="logout()">Log out</a></li>
      </ul>
    </nav>
  </header>

  <main id="main">
    <h1>Dashboard: <span id="dept-name"></span></h1>
    <p id="summary"></p>

    <div class="filter-bar">
      <div class="field">
        <label for="filter-status">Status</label>
        <select id="filter-status">
          <option value="all">All</option>
          <option value="pending">Pending</option>
          <option value="in_progress">In progress</option>
          <option value="resolved">Resolved</option>
        </select>
      </div>
      <div class="field">
        <label for="search">Search title</label>
        <input type="text" id="search">
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Title</th>
            <th>Status</th>
            <th>Date</th>
            <th>Replies</th>
            <th>Open</th>
          </tr>
        </thead>
        <tbody id="complaint-rows"></tbody>
      </table>
    </div>

    <p id="empty-message" class="empty" hidden>No complaints match.</p>
  </main>

  <footer>
    <p>StuDesk: complaints and feedback for our campus. MCA Web Technology mini project.</p>
  </footer>

  <script src="/static/js/common.js"></script>
  <script src="/static/js/pages/staff-dashboard.js"></script>
</body>
</html>
