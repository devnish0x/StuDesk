apiVersion: apps/v1
kind: Deployment
metadata:
  name: campus-complaint-hub
  labels:
    app: campus-complaint-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: campus-complaint-hub
  template:
    metadata:
      labels:
        app: campus-complaint-hub
    spec:
      containers:
        - name: campus-complaint-hub
          image: campus-complaint-hub:v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20